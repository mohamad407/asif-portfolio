<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#080808">
    <title>Admin — Mohammad Asihf Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="admin.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.css">
</head>
<body>

    <!-- Login Screen -->
    <div id="loginScreen" class="login-screen">
        <div class="login-card">
            <div class="login-icon">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 018 0v4"/></svg>
            </div>
            <h2 class="login-title">Admin Access</h2>
            <p class="login-subtitle">Sign in to manage your portfolio</p>
            <p id="loginNote" class="login-note hidden"></p>
            <form id="loginForm" class="login-form">
                <div class="input-group">
                    <label class="input-label" for="loginUsername">Username</label>
                    <input type="text" id="loginUsername" class="login-input" placeholder="Enter username" autocomplete="username" required>
                </div>
                <div class="input-group">
                    <label class="input-label" for="loginPassword">Password</label>
                    <input type="password" id="loginPassword" class="login-input" placeholder="Enter password" autocomplete="current-password" required>
                </div>
                <p id="loginError" class="login-error hidden"></p>
                <button type="submit" class="login-btn" id="loginBtn">Sign in</button>
            </form>
            <a href="/" class="login-back">← Back to portfolio</a>
        </div>
    </div>

    <!-- Dashboard -->
    <div id="dashboard" class="dashboard hidden">
        <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <span class="sidebar-logo">MA</span>
                <span class="sidebar-title">Admin</span>
            </div>
            <nav class="sidebar-nav">
                <a href="#" class="sidebar-link active" data-section="overview">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
                    <span>Overview</span>
                </a>
                <a href="#" class="sidebar-link" data-section="about">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 016-6h4a6 6 0 016 6v1"/></svg>
                    <span>About</span>
                </a>
                <a href="#" class="sidebar-link" data-section="skills">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
                    <span>Skills</span><em class="nav-count" data-count="skills"></em>
                </a>
                <a href="#" class="sidebar-link" data-section="projects">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 01-2 2H4a2 2 0 01-2-2V5a2 2 0 012-2h5l2 3h9a2 2 0 012 2z"/></svg>
                    <span>Projects</span><em class="nav-count" data-count="projects"></em>
                </a>
                <a href="#" class="sidebar-link" data-section="experience">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a2 2 0 00-2-2h-4a2 2 0 00-2 2v2"/></svg>
                    <span>Experience</span><em class="nav-count" data-count="experience"></em>
                </a>
                <a href="#" class="sidebar-link" data-section="stats">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M18 20V10M12 20V4M6 20v-6"/></svg>
                    <span>Stats</span><em class="nav-count" data-count="stats"></em>
                </a>
                <a href="#" class="sidebar-link" data-section="contact">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M22 6l-10 7L2 6"/></svg>
                    <span>Contact</span><em class="nav-count" data-count="contact"></em>
                </a>
            </nav>
            <div class="sidebar-footer">
                <div id="sidebarUsername" class="sidebar-username"></div>
                <button id="logoutBtn" class="sidebar-logout">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                    <span>Logout</span>
                </button>
            </div>
        </aside>

        <main class="main-content" id="mainContent">
            <header class="main-header">
                <div class="header-left">
                    <button class="mobile-toggle" id="mobileToggle" aria-label="Toggle menu">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
                    </button>
                    <h1 id="pageTitle" class="page-title">Overview</h1>
                </div>
                <div class="header-actions">
                    <a href="/" target="_blank" rel="noopener" class="btn btn-ghost btn-sm" title="Open your portfolio in a new tab">
                        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
                        <span class="hide-sm">View site</span>
                    </a>
                    <button id="changePasswordBtn" class="btn btn-ghost btn-sm" title="Change password">
                        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
                        <span class="hide-sm">Password</span>
                    </button>
                    <button id="resetBtn" class="btn btn-ghost btn-sm btn-warn" title="Reset all content to defaults">
                        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 102.13-9.36L1 10"/></svg>
                        <span class="hide-sm">Reset</span>
                    </button>
                </div>
            </header>
            <div id="sectionContent" class="section-content"></div>
        </main>
    </div>

    <!-- Modal (content is built by admin.js) -->
    <div id="modal" class="modal" role="dialog" aria-modal="true">
        <div class="modal-backdrop" id="modalBackdrop"></div>
        <div class="modal-content" id="modalContent"></div>
    </div>

    <!-- Change Password Modal -->
    <div id="changePasswordModal" class="modal" role="dialog" aria-modal="true" aria-label="Change password">
        <div class="modal-backdrop" onclick="closeChangePasswordModal()"></div>
        <form id="changePasswordForm" class="modal-content">
            <div class="modal-head">
                <h3 class="modal-title">Change password</h3>
                <button type="button" class="btn btn-ghost btn-icon" onclick="closeChangePasswordModal()" aria-label="Close">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                </button>
            </div>
            <div class="modal-body">
                <div class="form-grid">
                    <div class="input-group span-2"><label class="input-label" for="cpCurrent">Current password</label><input type="password" id="cpCurrent" class="input" required autocomplete="current-password"></div>
                    <div class="input-group"><label class="input-label" for="cpNew">New password</label><input type="password" id="cpNew" class="input" placeholder="Min 8 characters" required autocomplete="new-password" minlength="8"></div>
                    <div class="input-group"><label class="input-label" for="cpConfirm">Confirm new password</label><input type="password" id="cpConfirm" class="input" required autocomplete="new-password"></div>
                </div>
                <p id="cpError" class="login-error hidden" style="margin-top:10px"></p>
            </div>
            <div class="modal-actions">
                <button type="button" class="btn btn-ghost" onclick="closeChangePasswordModal()">Cancel</button>
                <button type="submit" class="btn btn-primary">Update password</button>
            </div>
        </form>
    </div>

    <!-- Toast -->
    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.js"></script>
    <script src="../config.js"></script>
    <script src="admin.js"></script>
</body>
</html>
